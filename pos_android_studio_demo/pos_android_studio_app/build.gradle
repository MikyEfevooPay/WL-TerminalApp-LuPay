apply plugin: 'com.android.application'

android {
    signingConfigs {
        debug {
            storeFile file('appkey.jks')
            storePassword 'gntcapital'
            keyPassword 'gntcapital'
            keyAlias 'efevopay'
        }
        config {
            keyAlias 'key0'
            keyPassword '123789'
            storeFile file('dspread.jks')
            storePassword '123789'
        }
    }
    compileSdk 33
    buildToolsVersion '30.0.3'
    defaultConfig {
        applicationId "com.efevoopay.demoui"
        minSdkVersion 17
        targetSdk 31
        versionCode 291
        versionName '1.5.9.6'

        ndk {
            moduleName "serial_port"
            // 根据需要添加必要的ABI
            abiFilters 'armeabi', 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }

        multiDexEnabled true
    }
    packagingOptions {
        exclude 'org/bouncycastle/x509/CertPathReviewerMessages_de.properties'
        exclude 'org/bouncycastle/x509/CertPathReviewerMessages.properties'
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    sourceSets.main {
        jniLibs.srcDir 'libs'
        jni.srcDirs = []
    }
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
        disable 'MissingTranslation'
        disable 'ExtraTranslation'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.3'
    implementation 'com.google.android.material:material:1.6.0'

    implementation 'pl.droidsonroids.gif:android-gif-drawable:1.2.24'

    implementation 'com.android.volley:volley:1.2.1'
    implementation 'com.iqiyi.xcrash:xcrash-android-lib:2.4.6'
    implementation 'com.binioter:guideview:1.0.0'
    implementation files('libs/zxing.jar')
    implementation 'org.jetbrains:annotations-java5:15.0'
    implementation files('libs/capx-lib_2.0.0.1.jar')

    implementation 'com.google.android.material:material:1.6.0'

    //https://frogames.es/solucion-a-error-con-el-dexfile-en-android-studionull-cannot-fit-requested-classes-in-a-single-dexfile/
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation files('libs/DUKPK2009_CBC.jar')
    implementation 'com.airbnb.android:lottie:6.0.1'
    //dspread sdk
    implementation 'com.dspread.print:dspread_print_sdk:1.2.0'

    implementation 'com.fasterxml.jackson.core:jackson-databind:2.8.5'
    implementation 'com.fasterxml.jackson.core:jackson-core:2.8.5'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.8.5'
}
